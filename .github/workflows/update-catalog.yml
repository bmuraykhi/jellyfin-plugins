name: Update catalog

on:
  repository_dispatch:
    types: [plugin-released]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - plugins.json
      - scripts/**
      - .github/workflows/update-catalog.yml
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Build manifest.json
        id: build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          subject=$(python3 scripts/build_manifest.py)
          echo "subject=$subject" >> "$GITHUB_OUTPUT"

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        if: steps.build.outputs.subject != ''
        id: app
        with:
          client-id: ${{ vars.CATALOG_APP_CLIENT_ID }}
          private-key: ${{ secrets.CATALOG_APP_PRIVATE_KEY }}

      - name: Commit manifest.json
        if: steps.build.outputs.subject != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SUBJECT: ${{ steps.build.outputs.subject }}
        run: |
          jq -n \
            --arg message "$SUBJECT" \
            --arg content "$(base64 -w 0 manifest.json)" \
            --arg sha "$(git rev-parse HEAD:manifest.json)" \
            --arg branch "$GITHUB_REF_NAME" \
            '{message: $message, content: $content, sha: $sha, branch: $branch}' |
            gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/manifest.json" --input - --jq .commit.html_url
