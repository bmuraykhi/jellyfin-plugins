name: Update catalog

# Rebuilds manifest.json from the plugins' GitHub releases. Runs hourly, on demand (Actions → Update catalog →
# Run workflow) and whenever the plugin list or the script changes.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - plugins.json
      - scripts/**

permissions:
  contents: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Build manifest.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/build_manifest.py

      - name: Commit changes
        run: |
          if git diff --quiet manifest.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "chore(catalog): update manifest.json"
          git push
